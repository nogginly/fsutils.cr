name: fsutils
version: 0.3.0
license: MPL-2.0
authors:
  - nogginly <nogginly@icloud.com>

description: File system utilities as Crystal helper classes for use without running shell commands.

crystal: ">= 1.20.0"

dependencies:
  html5:
    github: naqvis/crystal-html5

development_dependencies:
  ameba:
    github: crystal-ameba/ameba

targets:
  fsu-find:
    main: samples/find.cr
  fsu-grep:
    main: samples/grep.cr
  fsu-cat:
    main: samples/cat.cr
  fsu-rename:
    main: samples/rename.cr
  fsu-fetch-as-md:
    main: samples/fetch_as_md.cr
